# Stash 专用差异源；构建时与 base.yaml 合并为 dist/stash.yaml，再由 Sub-Store 注入节点并覆写。
$profile: stash

# Stash 使用国内 DNS，并为 oixCloud 域名单独指定解析。
dns:
  nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
  nameserver-policy: # DNS 分流策略：精准匹配国内域名
    "+.cloud-nodes.com": 124.221.68.73:1053

# 所有代理组、筛选和候选顺序直接继承 base.yaml。
