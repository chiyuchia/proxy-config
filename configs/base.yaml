      members:
        mode: append
    type: select
    filter: "(良心云)"

  - name: "✈️ 良心云 亚太"
    x-substore:
      members:
        mode: replace
        exclude-dialer: true
        types: [vless]
    <<: *url_test_defaults
    # 仅筛选 HK、SG、JP、TW 地区且名称包含 CT 的节点，兼容 CTCU、CTCUCM 标签。
    # x-substore.members 声明仅纳入实际 VLESS 协议，并排除带 dialer-proxy 的节点。
    filter: '(?i)^(?=.*良心云)(?=.*CT)(?=.*(?:^|\s)(?:HK|SG|JP|TW)(?:\s|-)).*'

  - name: "✈️ 良心云 Hy2"
    x-substore:
      members:
        mode: replace
        exclude-dialer: true
        types: [hysteria2, hy2]
    <<: *url_test_defaults
    # x-substore.members 声明仅纳入实际 Hy2 协议，并排除带 dialer-proxy 的节点。
    filter: "(良心云)"

  - name: "✈️ 一元机场"
    x-substore:
      members:
        mode: append
    type: select
    filter: "(一元机场)"

  - name: "🎯 全球直连"
    x-substore:
      members:
        mode: manual
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

