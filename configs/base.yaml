  - name: "✈️ 吹雪云 亚太"
    x-substore:
      members:
        mode: replace
        exclude-dialer: true
    <<: *url_test_defaults
    # 仅筛选 HK、SG、JP、TW 地区且名称包含“电信”的节点；不限制协议类型。
    # x-substore.members 声明重建成员，并排除带 dialer-proxy 的节点。
    filter: '(?i)^(?=.*吹雪云)(?=.*电信)(?=.*(?:^|\s)(?:HK|SG|JP|TW)(?:\s|-)).*'

