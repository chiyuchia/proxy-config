  - name: "✈️ VikingLinks 亚太"
    x-substore:
      members:
        mode: replace
        exclude-dialer: true
    # 公共测速参数在此定义，后续测速组通过 YAML 合并键复用。
    <<: &url_test_defaults
      type: url-test
      url: "https://cp.cloudflare.com/generate_204"
      interval: 60
      timeout: 5000
      lazy: false
      tolerance: 100 # 延迟改善超过 100 ms 再切换，减少小幅波动导致的频繁换点。
      max-failed-times: 3
      expected-status: 204
    # 仅筛选 HK、SG、JP、TW 地区的 Go、IEPL、SH 线路。
    # x-substore.members 声明重建成员，并排除带 dialer-proxy 的节点。
    filter: '(?i)^(?=.*\bVikingLinks\b)(?=.*(?:^|\s)(?:HK|SG|JP|TW)(?:\s|-))(?=.*\b(?:Go|IEPL|SH)\b).*'

