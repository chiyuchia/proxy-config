# Stash 专用差异；与 base.yaml 合并后交给节点注入和 dist/config-overwrite.js。
$profile: stash

# Stash 使用国内 DNS，并为 oixCloud 域名单独指定解析。
dns:
  nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
  nameserver-policy: # DNS 分流策略：精准匹配国内域名
    "+.cloud-nodes.com": 124.221.68.73:1053

# 所有代理组、筛选和候选顺序直接继承 base.yaml。
